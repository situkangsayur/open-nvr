version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: opennvr-postgres
    environment:
      POSTGRES_USER: opennvr
      POSTGRES_PASSWORD: opennvr
      POSTGRES_DB: opennvr
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opennvr -d opennvr"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - opennvr-network

  keycloak-db:
    image: postgres:16
    container_name: opennvr-keycloak-db
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: keycloak
    ports:
      - "5433:5432"
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - opennvr-network

  redis:
    image: redis:7
    container_name: opennvr-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - opennvr-network

  minio:
    image: minio/minio:latest
    container_name: opennvr-minio
    environment:
      MINIO_ROOT_USER: opennvr
      MINIO_ROOT_PASSWORD: opennvr_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - opennvr-network

  minio-init:
    image: minio/mc:latest
    container_name: opennvr-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set opennvr http://minio:9000 opennvr opennvr_secret &&
      mc mb --ignore-existing opennvr/opennvr-recordings &&
      echo 'Bucket opennvr-recordings created successfully'
      "
    networks:
      - opennvr-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: opennvr-keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    command: start-dev --import-realm
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - opennvr-network

volumes:
  postgres-data:
  keycloak-db-data:
  minio-data:

networks:
  opennvr-network:
    driver: bridge
