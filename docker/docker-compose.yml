services:
  postgres:
    image: postgres:16
    container_name: opennvr-postgres
    environment:
      POSTGRES_USER: opennvr
      POSTGRES_PASSWORD: opennvr_secret
      POSTGRES_DB: opennvr
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opennvr -d opennvr"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - opennvr-network

  redis:
    image: redis:7
    container_name: opennvr-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - opennvr-network

  minio:
    image: minio/minio:latest
    container_name: opennvr-minio
    environment:
      MINIO_ROOT_USER: opennvr
      MINIO_ROOT_PASSWORD: opennvr_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - opennvr-network

  minio-init:
    image: minio/mc:latest
    container_name: opennvr-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set opennvr http://minio:9000 opennvr opennvr_secret &&
      mc mb --ignore-existing opennvr/opennvr-recordings &&
      echo 'Bucket opennvr-recordings created successfully'
      "
    networks:
      - opennvr-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: opennvr-keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: opennvr
      KC_DB_PASSWORD: opennvr_secret
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    command: start-dev --import-realm
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - opennvr-network

  nats:
    image: nats:2
    container_name: opennvr-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["--jetstream", "--http_port", "8222"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - opennvr-network

  # Optional: OpenSearch for log analysis
  # Start with: docker compose --profile logging up -d
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    profiles: ["logging"]
    container_name: opennvr-opensearch
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=OpenNvr@2024!
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - opennvr-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 | grep -q 'cluster_name'"]
      interval: 30s
      timeout: 10s
      retries: 5

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.1
    profiles: ["logging"]
    container_name: opennvr-opensearch-dashboards
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - opennvr-network

volumes:
  postgres-data:
  minio-data:
  opensearch-data:

networks:
  opennvr-network:
    driver: bridge
