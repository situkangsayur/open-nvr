[package]
name = "open-nvr"
version = "0.1.0"
edition = "2021"

[dependencies]
open-nvr-domain = { path = "crates/domain" }
open-nvr-application = { path = "crates/application" }
open-nvr-infrastructure = { path = "crates/infrastructure" }
open-nvr-api = { path = "crates/api" }
open-nvr-worker = { path = "crates/worker" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
config = "0.14"
dotenvy = "0.15"
anyhow = { workspace = true }
tower-http = { workspace = true }
axum = { workspace = true }

[workspace]
members = [
    ".",
    "crates/domain",
    "crates/application",
    "crates/infrastructure",
    "crates/api",
    "crates/worker",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
async-trait = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "fs"] }
bytes = "1"
